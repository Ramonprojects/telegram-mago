  <script>                                
  (function(){                                                                                                                                                                   
    var B="https://smartico-dashboard-production.up.railway.app/track/34c58208-a263-4454-bbc4-6b736e47d42b";                                                                     
    var R="https://smartico-dashboard-production.up.railway.app/track/34c58208-a263-4454-bbc4-6b736e47d42b/redirect";                                                            
    var k="_tid";                                                                                                                                                                
    var sid=sessionStorage.getItem(k)||(Math.random().toString(36).slice(2)+Date.now().toString(36));                                                                          
    sessionStorage.setItem(k,sid);                                                                                                                                               
                                                                                                                                                                                 
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.
  version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.faceb
  ook.net/en_US/fbevents.js');                                                                                                                                                   
    fbq('init','953058917590545');                                                                                                                                               
    fbq('track','PageView');                                                                                                                                                     
                                                                                                                                                                                 
    var sp=new URLSearchParams(location.search);                                                                                                                               
    var utms=["utm_source","utm_medium","utm_campaign","utm_content","utm_term"];                                                                                                
    var utmParams={};                         
    utms.forEach(function(u){ var v=sp.get(u); if(v) utmParams[u]=v; });                                                                                                         
    if(Object.keys(utmParams).length) sessionStorage.setItem("_utms",JSON.stringify(utmParams));                                                                               
                                                                                                                                                                                 
    function getUtms(){ try{ return JSON.parse(sessionStorage.getItem("_utms")||"{}"); }catch(e){ return {}; } }                                                               
                                                                                                                                                                                 
    function track(type,meta){                                                                                                                                                   
      fetch(B,{                                                                                                                                                                  
        method:"POST",                                                                                                                                                           
        headers:{"Content-Type":"application/json"},                                                                                                                             
        body:JSON.stringify({event_type:type,session_id:sid,url:location.href,metadata:Object.assign({},getUtms(),meta||{})}),                                                 
        keepalive:true                                                                                                                                                           
      }).catch(function(){});                                                                                                                                                  
    }                                                                                                                                                                            
                                                                                                                                                                                 
    track("pageview");                                                                                                                                                           
                                                                                                                                                                                 
    function wireButtons(){                                                                                                                                                    
      document.querySelectorAll("[data-trackpanel]").forEach(function(el){                                                                                                       
        var q=new URLSearchParams(getUtms()).toString();                                                                                                                       
        el.href=R+(q?"?"+q:"");               
        el.addEventListener("click",function(){
          if(typeof fbq!=="undefined") fbq('trackCustom','TrackOut');                                                                                                            
        },true);                                                                                                                                                                 
      });                                                                                                                                                                        
    }                                                                                                                                                                            
    wireButtons();                                                                                                                                                               
                                                                                                                                                                                 
    document.addEventListener("click",function(e){                                                                                                                               
      var el=e.target;                                                                                                                                                           
      while(el&&el!==document.body){                                                                                                                                           
        if(el.dataset&&el.dataset.track){     
          track("click",{label:el.dataset.track,text:el.innerText||""});
          return;                             
        }                                                                                                                                                                        
        if(el.tagName==="BUTTON"||el.tagName==="A"){
          track("click",{tag:el.tagName,text:el.innerText||"",href:el.href||""});                                                                                                
          return;                                                                                                                                                                
        }                                                                                                                                                                        
        el=el.parentElement;                                                                                                                                                     
      }                                                                                                                                                                          
    },true);                              
  })();                                                                                                                                                                          
  </script>

    @keyframes pulse-btn {

  <body>                                                                                                                                                                         
                                                                                                                                                                                 
  <canvas id="holo"></canvas>                                                                                                                                                    
                                                                                                                                                                                 
  <div class="page">

      <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447
   1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.19 13.028l-2.96-.924c-.643-.2-.657-.643.136-.953l11.57-4.461c.537-.194 
  1.006.131.958.531z"/></svg>             
    </div>

      <div class="dot-red"></div>                                                                                                                                                
      Quem não entrou hoje já perdeu <span id="lost" style="margin:0 4px">R$847</span>                                                                                         
    </div>                                    
                                          
    <div class="copy">                                                                                                                                                           
      <h1>Cada minuto fora<br>custa dinheiro.</h1>                                                                                                                               
      <p class="sub">Enquanto você hesita, membros do canal já estão lucrando agora no <span>Telegram</span>. Não deixe pra depois. 👇</p>

    <div class="cta-wrap">                                                                                                                                                       
      <a href="#" class="cta" data-trackpanel>                                                                                                                                   
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97                          
  9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.19

  <script>                                                                                                                                                                       
  const canvas = document.getElementById('holo');
  const ctx = canvas.getContext('2d');                                                                                                                                           
                                                                                                                                                                               
  function resize() {
    canvas.width  = window.innerWidth;                                                                                                                                           
    canvas.height = window.innerHeight;       
  }                                                                                                                                                                              
  resize();                                                                                                                                                                    
  window.addEventListener('resize', resize);                                                                                                                                     
   
  const W = () => canvas.width;                                                                                                                                                  
  const H = () => canvas.height;                                                                                                                                               
                                              
  const waves = [                         
    { y: 0, speed: 0.4,  amp: 18, freq: 0.012, alpha: 0.18, color: '0,200,255',  width: 1.5 },
    { y: 0, speed: 0.28, amp: 26, freq: 0.008, alpha: 0.10, color: '0,150,255',  width: 1.0 },                                                                                   
    { y: 0, speed: 0.55, amp: 12, freq: 0.018, alpha: 0.13, color: '80,220,255', width: 1.0 },
    { y: 0, speed: 0.20, amp: 34, freq: 0.006, alpha: 0.07, color: '0,180,255',  width: 2.0 },                                                                                   
    { y: 0, speed: 0.70, amp:  8, freq: 0.022, alpha: 0.09, color: '120,240,255',width: 0.8 },                                                                                   
  ];                                                                                                                                                                             
                                                                                                                                                                                 
  waves.forEach((w, i) => { w.y = (H() / (waves.length + 1)) * (i + 1); });                                                                                                      
                                                                                                                                                                                 
  const particles = Array.from({length: 38}, () => ({                                                                                                                            
    x: Math.random() * window.innerWidth,                                                                                                                                        
    y: Math.random() * window.innerHeight,                                                                                                                                     
    r: Math.random() * 1.4 + 0.3,                                                                                                                                                
    vx: (Math.random() - 0.5) * 0.4,                                                                                                                                           
    vy: (Math.random() - 0.5) * 0.25,                                                                                                                                            
    alpha: Math.random() * 0.4 + 0.05,                                                                                                                                           
  }));                                        
                                                                                                                                                                                 
  let t = 0;                                                                                                                                                                   
                                                                                                                                                                                 
  function draw() {                                                                                                                                                            
    ctx.clearRect(0, 0, W(), H());                                                                                                                                               
                                                                                                                                                                               
    waves.forEach(w => {                  
      w.y += w.speed * 0.3;
      if (w.y > H() + 60) w.y = -60;                                                                                                                                             
                                              
      ctx.beginPath();                                                                                                                                                           
      for (let x = 0; x <= W(); x += 2) {                                                                                                                                        
        const y = w.y + Math.sin(x * w.freq + t * w.speed * 0.8) * w.amp;                                                                                                        
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);                                                                                                                           
      }                                                                                                                                                                          
      ctx.shadowBlur = 18;                                                                                                                                                     
      ctx.shadowColor = `rgba(${w.color},0.6)`;                                                                                                                                  
      ctx.strokeStyle = `rgba(${w.color},${w.alpha})`;                                                                                                                           
      ctx.lineWidth = w.width;                                                                                                                                                   
      ctx.stroke();                                                                                                                                                              
                                                                                                                                                                                 
      ctx.beginPath();
      for (let x = 0; x <= W(); x += 2) {                                                                                                                                        
        const y = w.y + Math.sin(x * w.freq + t * w.speed * 0.8) * w.amp;                                                                                                      
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);                                                                                                                           
      }                                                                                                                                                                        
      ctx.strokeStyle = `rgba(${w.color},${w.alpha * 0.5})`;
      ctx.lineWidth = w.width * 3;                                                                                                                                               
      ctx.shadowBlur = 30;                    
      ctx.stroke();                                                                                                                                                              
      ctx.shadowBlur = 0;                                                                                                                                                        
    });                                                                                                                                                                          
                                                                                                                                                                                 
    particles.forEach(p => {                                                                                                                                                     
      p.x += p.vx;                                                                                                                                                             
      p.y += p.vy;
      if (p.x < 0) p.x = W();                                                                                                                                                    
      if (p.x > W()) p.x = 0;
      if (p.y < 0) p.y = H();                                                                                                                                                    
      if (p.y > H()) p.y = 0;                                                                                                                                                  

      ctx.beginPath();                                                                                                                                                           
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,200,255,${p.alpha})`;                                                                                                                              
      ctx.shadowBlur = 6;                                                                                                                                                        
      ctx.shadowColor = 'rgba(0,200,255,0.5)';
      ctx.fill();                                                                                                                                                                
      ctx.shadowBlur = 0;                                                                                                                                                        
    });                                   
                                                                                                                                                                                 
    ctx.strokeStyle = 'rgba(0,180,255,0.03)';                                                                                                                                    
    ctx.lineWidth = 1;
    const gs = 60;                                                                                                                                                               
    for (let x = 0; x < W(); x += gs) {                                                                                                                                        
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H()); ctx.stroke();
    }                                                                                                                                                                            
    for (let y = 0; y < H(); y += gs) {       
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W(), y); ctx.stroke();                                                                                                       
    }                                                                                                                                                                          
                                                                                                                                                                                 
    t += 0.018;                                                                                                                                                                
    requestAnimationFrame(draw);                                                                                                                                                 
  }                                                                                                                                                                              
   
  draw();                                                                                                                                                                        
                                                                                                                                                                               
  const valores = [847, 923, 1105, 1284, 1390, 1512, 1678, 1820, 1947, 2103, 2250, 2389];
  let idx = 0;                            
  const lostEl = document.getElementById('lost');
  setInterval(() => {                                                                                                                                                            
    idx = (idx + 1) % valores.length;     
    lostEl.textContent = 'R$' + valores[idx].toLocaleString('pt-BR');                                                                                                            
    lostEl.style.animation = 'none';                                                                                                                                             
    lostEl.offsetHeight;                      
    lostEl.style.animation = 'popRed .4s ease';                                                                                                                                  
  }, 4000);                                                                                                                                                                      
  </script>                                                                                                                                                                      
                                                                                                                                                                                 
  </body>
